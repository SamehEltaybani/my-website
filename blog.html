<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <base href="/my-website/">

    <title>Dr. Sameh Eltaybani - Blog</title>
    <meta name="description" content="Read the latest blog posts by Dr. Sameh Eltaybani on healthcare research, data analysis, education, and more.">
    <meta property="og:title" content="Dr. Sameh Eltaybani - Blog">
    <meta property="og:description" content="Read the latest blog posts by Dr. Sameh Eltaybani on healthcare research, data analysis, education, and more.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="blog.html">

    <link rel="icon" type="image/x-icon" href="img/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="assets/css/style.css" />
</head>
    
<body>

    <!-- ===== BLOG HEADER ===== -->
    
    <div class="page-header-wrapper-simple">
        <div class="container">
            <h1 class="page-header-title-simple">Blog</h1>
        </div>
    </div>

    <!-- ===== MAIN CONTENT (Restricted to 1200px) ===== -->
    
    <div class="container">

        <!-- ===== BLOG LIST ===== -->
        
        <div id="blog-list" class="blog-list">
            <p style="color: var(--dark-color); opacity: 0.6;">Loading blog posts...</p>
        </div>

        <!-- ===== CLOSING CTA ===== -->
        
        <div class="closing-cta">
            <p class="cta-question">Cannot find what you are looking for or have a question?</p>
            <p class="cta-action">
                Use the central search option on the top right corner
                <i class="fa-solid fa-magnifying-glass"></i>
                or feel free to
                <a href="contact.html" class="cta-link">
                    contact me <i class="fa-regular fa-envelope"></i>
                </a>
            </p>
        </div>

    </div><!-- end .container -->

    <!-- ===== JAVASCRIPT LOAD ORDER ===== -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/back-to-top.js"></script>

    <!-- ===== BLOG RENDERER ===== -->
    
    <script>
        (function() {
            'use strict';

            let allPosts = [];
            let loadedCount = 0;
            const pageSize = 10;

            // Helper: Format date
            function formatDate(dateString) {
                if (!dateString) return '';
                const date = new Date(dateString);
                if (isNaN(date)) return dateString;
                return date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            }

            // Helper: Truncate summary
            function truncateSummary(text, maxLength) {
                if (!text) return '';
                if (text.length <= maxLength) return text;
                return text.substring(0, maxLength).trim() + '...';
            }

            // Helper: Create card HTML for a single blog post
            function createCardHTML(post) {
                let html = '';

                // 1. Title (linked to blogfile)
                if (post.blogfile) {
                    html += '<div class="blog-title"><a href="' + window.escapeHTML(post.blogfile) + '">' + window.escapeHTML(post.title) + '</a></div>';
                } else if (post.title) {
                    html += '<div class="blog-title">' + window.escapeHTML(post.title) + '</div>';
                }

                // 2. Short Title (optional)
                if (post.shortTitle) {
                    html += '<div class="blog-short-title">' + window.escapeHTML(post.shortTitle) + '</div>';
                }

                // 3. Date + Reading Time
                let metaHtml = '<div class="blog-meta">';
                if (post.date) {
                    metaHtml += '<span class="blog-date"><i class="fa-regular fa-calendar"></i> ' + formatDate(post.date) + '</span>';
                }
                if (post.readingTime) {
                    metaHtml += '<span class="blog-reading-time"><i class="fa-regular fa-clock"></i> ' + window.escapeHTML(post.readingTime) + '</span>';
                }
                metaHtml += '</div>';
                html += metaHtml;

                // 4. Categories (tags)
                if (post.categories && post.categories.length > 0) {
                    let tagsHtml = '<div class="blog-tags">';
                    post.categories.forEach(function(cat) {
                        tagsHtml += '<span class="blog-tag">' + window.escapeHTML(cat) + '</span>';
                    });
                    tagsHtml += '</div>';
                    html += tagsHtml;
                }

                // 5. Summary (truncated to 200)
                if (post.summary) {
                    const truncated = truncateSummary(post.summary, 200);
                    html += '<div class="blog-summary">' + window.escapeHTML(truncated) + '</div>';
                }

                // 6. Read More link
                if (post.blogfile) {
                    html += '<div class="blog-read-more"><a href="' + window.escapeHTML(post.blogfile) + '" class="blog-read-more-link">Read more <i class="fa-solid fa-arrow-right"></i></a></div>';
                }

                return html;
            }

            // Helper: Create separator
            function createSeparator(abovePage, belowPage) {
                const sep = document.createElement('div');
                sep.className = 'publication-separator';
                sep.innerHTML = `
                    <span class="separator-label separator-above">Page ${abovePage} ▲</span>
                    <span class="separator-line"></span>
                    <span class="separator-label separator-below">Page ${belowPage} ▼</span>
                `;
                return sep;
            }

            // Main render function
            function renderPosts() {
                const container = document.getElementById('blog-list');
                container.innerHTML = '';

                if (!allPosts || allPosts.length === 0) {
                    container.innerHTML = '<p style="color: var(--dark-color); opacity: 0.6;">No blog posts found.</p>';
                    return;
                }

                if (loadedCount === 0) {
                    loadedCount = Math.min(pageSize, allPosts.length);
                }

                // Sort posts by date (newest first)
                allPosts.sort(function(a, b) {
                    if (!a.date) return 1;
                    if (!b.date) return -1;
                    return new Date(b.date) - new Date(a.date);
                });

                // --- Render posts ---
                for (let i = 0; i < loadedCount; i++) {
                    if (i > 0 && i % pageSize === 0) {
                        const pageNum = Math.floor(i / pageSize) + 1;
                        const abovePage = pageNum - 1;
                        const belowPage = pageNum;
                        const sep = createSeparator(abovePage, belowPage);
                        container.appendChild(sep);
                    }

                    const card = document.createElement('div');
                    card.className = 'blog-card';
                    card.innerHTML = createCardHTML(allPosts[i]);
                    container.appendChild(card);
                }

                // --- Add bottom separator + "See More" if more items exist ---
                if (loadedCount < allPosts.length) {
                    const currentPage = Math.floor(loadedCount / pageSize) + 1;
                    const nextPage = currentPage + 1;

                    const sep = createSeparator(currentPage, nextPage);
                    container.appendChild(sep);

                    const wrapper = document.createElement('div');
                    wrapper.style.cssText = 'text-align: center; margin: var(--space-md) 0;';
                    
                    const seeMoreBtn = document.createElement('button');
                    seeMoreBtn.className = 'see-more-btn';
                    seeMoreBtn.innerHTML = 'See more <i class="fa-solid fa-arrow-down"></i>';
                    seeMoreBtn.addEventListener('click', function() {
                        loadedCount = Math.min(loadedCount + pageSize, allPosts.length);
                        renderPosts();
                    });
                    
                    wrapper.appendChild(seeMoreBtn);
                    container.appendChild(wrapper);
                }
            }

            // Fetch blog posts
            async function loadPosts() {
                const container = document.getElementById('blog-list');

                try {
                    const response = await fetch('json/blog.json');
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    allPosts = await response.json();

                    if (!allPosts || allPosts.length === 0) {
                        container.innerHTML = '<p style="color: var(--dark-color); opacity: 0.6;">No blog posts found.</p>';
                        return;
                    }

                    loadedCount = Math.min(pageSize, allPosts.length);
                    renderPosts();

                } catch (error) {
                    container.innerHTML = '<p style="color: var(--dark-color); opacity: 0.6;">Unable to load blog posts at this time. Please try again later.</p>';
                    console.error('Error loading blog posts:', error);
                }
            }

            document.addEventListener('DOMContentLoaded', loadPosts);
        })();
    </script>

</body>
</html>
