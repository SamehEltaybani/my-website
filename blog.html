<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dr. Sameh Eltaybani - Blog</title>
    <meta name="description" content="Read the latest blog posts by Dr. Sameh Eltaybani on healthcare research, data analysis, education, and more.">
    <meta property="og:title" content="Dr. Sameh Eltaybani - Blog">
    <meta property="og:description" content="Read the latest blog posts by Dr. Sameh Eltaybani on healthcare research, data analysis, education, and more.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="blog.html">

    <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'nonce-secure123' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
    font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
    img-src 'self' data: https://api.qrserver.com;
    connect-src 'self';
    frame-src 'self';
    object-src 'none';
    base-uri 'self';
    ">

    <link rel="icon" type="image/x-icon" href="/my-website/img/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="/my-website/assets/css/style.css" />
</head>
    
<body class="page-blog">
    
    <!-- ===== BLOG HEADER ===== -->
    <div class="page-header-wrapper-simple">
        <div class="container">
            <h1 class="page-header-title-simple">Blog Articles & Insights</h1>
        </div>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="container">

        <!-- ===== BANNER (Single Result View) ===== -->
        <div class="blog-banner" id="blog-banner">
            <span class="blog-banner-text">
                <i class="fa-regular fa-eye"></i>
                You are currently viewing a single blog article.
            </span>
            <a href="/my-website/blog.html" class="blog-banner-btn" id="banner-reset-btn">
                <i class="fa-solid fa-arrow-left"></i> View all articles
            </a>
        </div>

        <!-- ===== CONTROLS BAR (Sticky) ===== -->
        <div class="blog-controls" id="blog-controls">
            <div class="controls-left">
                <span class="controls-status" id="controls-status">
                    Loading...
                </span>
                <i class="fa-regular fa-circle-question status-info-icon" id="status-info-icon"></i>
            </div>
            <div class="controls-right">

                <!-- Filter Button -->
                <div class="dropdown-wrapper filter-wrapper">
                    <button class="control-btn" id="filter-btn">
                        <i class="fa-solid fa-sliders"></i>
                        <span>Filter</span>
                        <span class="badge" id="filter-badge"></span>
                    </button>
                </div>

                <!-- Sort Button -->
                <div class="dropdown-wrapper">
                    <button class="control-btn" id="sort-btn">
                        <i class="fa-solid fa-arrow-up-wide-short"></i>
                        <span>Sort</span>
                    </button>
                    <div class="sort-dropdown" id="sort-dropdown"></div>
                </div>

                <!-- Reset Button -->
                <button class="control-btn" id="reset-btn">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>Reset</span>
                </button>
            </div>
        </div>

        <!-- ===== BLOG LIST ===== -->
        <div id="blog-list" class="blog-list">
            <p class="item-loading-message">Loading blog articles...</p>
        </div>

        <!-- ===== CLOSING CTA ===== -->
        <div class="closing-cta">
            <p class="cta-question">Cannot find what you are looking for or have a question?</p>
            <p class="cta-action">
                Use the central search option on the top right corner
                <i class="fa-solid fa-magnifying-glass"></i>
                or feel free to
                <a href="/my-website/contact.html" class="cta-link">
                    contact me <i class="fa-regular fa-envelope"></i>
                </a>
            </p>
        </div>

    </div><!-- end .container -->
    
    <!-- Container for filter dropdown (moved outside controls bar) -->
    <div id="filter-dropdown-container"></div>

    <!-- ===== JAVASCRIPT ===== -->
    <script src="/my-website/assets/js/utils.js"></script>
    <script src="/my-website/assets/js/navbar.js"></script>
    <script src="/my-website/assets/js/footer.js"></script>
    <script src="/my-website/assets/js/back-to-top.js"></script>
    <script src="/my-website/assets/js/search.js"></script>
    <script src="/my-website/assets/js/blog.js"></script>

</body>
</html>
