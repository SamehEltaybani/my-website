<!DOCTYPE html>
<html lang="en">
  
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dr. Sameh Eltaybani - Newsletter</title>
    <meta name="description" content="Stay updated with Dr. Sameh Eltaybani's latest research, publications, and blog articles. Subscribe to the newsletter.">
    <meta property="og:title" content="Dr. Sameh Eltaybani - Newsletter">
    <meta property="og:description" content="Stay updated with Dr. Sameh Eltaybani's latest research, publications, and blog articles.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="newsletter.html">

    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'nonce-secure123' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data: https://api.qrserver.com;
        connect-src 'self';
        frame-src 'self';
        object-src 'none';
        base-uri 'self';
        ">

    <link rel="icon" type="image/x-icon" href="/my-website/img/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="/my-website/assets/css/style.css" />
  
</head>
  
<body>

    <!-- ===== NEWSLETTER HEADER ===== -->
  
    <div class="page-header-wrapper-simple">
        <div class="container">
            <h1 class="page-header-title-simple">Newsletter</h1>
        </div>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
  
    <div class="container">

        <!-- ===== INTRO PARAGRAPH ===== -->
        <p class="newsletter-intro">
            I am planning to release a regular newsletter with updates on my latest research,
            new publications, and recent blog articles.<br />
            Subscribe now to get notified when new content is published.
        </p>

        <!-- ===== NEWSLETTER CARD ===== -->
        <div class="newsletter-card">

            <!-- ===== BUTTONS ===== -->
            <div class="newsletter-buttons">

                <!-- Subscribe Button -->
                <button id="subscribe-btn" class="newsletter-btn subscribe-btn">
                    <i class="fa-regular fa-envelope"></i>
                    Subscribe
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <!-- Unsubscribe Button -->
                <button id="unsubscribe-btn" class="newsletter-btn unsubscribe-btn">
                    <i class="fa-regular fa-envelope-open"></i>
                    Unsubscribe
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </div>

            <!-- ===== SUCCESS / INFO MESSAGE ===== -->
            <div id="newsletter-message" class="newsletter-message" style="display: none;">
                <i class="fa-regular fa-circle-check"></i>
                <p><strong>Thank you!</strong> Your request has been sent. Please check your email to confirm.</p>
            </div>

        </div>

    </div><!-- end .container -->

    <!-- ===== JAVASCRIPT ===== -->
    <script src="/my-website/assets/js/utils.js"></script>
    <script src="/my-website/assets/js/navbar.js"></script>
    <script src="/my-website/assets/js/footer.js"></script>
    <script src="/my-website/assets/js/back-to-top.js"></script>
    <script src="/my-website/assets/js/search.js"></script>

    <!-- ===== NEWSLETTER SCRIPTS ===== -->
  
    <script nonce="secure123">
        (function() {
            'use strict';

            // ============================================
            // EMAIL OBFUSCATION (same as contact page)
            // ============================================
            const user = 'eltaybanisameh';
            const domain = 'gmail.com';
            const email = user + '@' + domain;

            // ============================================
            // SUBSCRIBE
            // ============================================
            const subscribeBtn = document.getElementById('subscribe-btn');
            if (subscribeBtn) {
                subscribeBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const subject = encodeURIComponent('Subscribe to newsletter');
                    const body = encodeURIComponent('Please add me to your newsletter list.\n\nThank you.');
                    window.location.href = 'mailto:' + email + '?subject=' + subject + '&body=' + body;
                    showMessage('Subscription request sent! Please check your email to confirm.');
                });
            }

            // ============================================
            // UNSUBSCRIBE
            // ============================================
            const unsubscribeBtn = document.getElementById('unsubscribe-btn');
            if (unsubscribeBtn) {
                unsubscribeBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const subject = encodeURIComponent('Unsubscribe from newsletter');
                    const body = encodeURIComponent('Please remove me from your newsletter list.\n\nThank you.');
                    window.location.href = 'mailto:' + email + '?subject=' + subject + '&body=' + body;
                    showMessage('Unsubscribe request sent! Please check your email to confirm.');
                });
            }

            // ============================================
            // SHOW MESSAGE
            // ============================================
            function showMessage(text) {
                const msgEl = document.getElementById('newsletter-message');
                const textEl = msgEl.querySelector('p');
                if (msgEl && textEl) {
                    textEl.innerHTML = '<strong>Thank you!</strong> ' + text;
                    msgEl.style.display = 'block';
                    msgEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

        })();
    </script>

</body>
</html>
