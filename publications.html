<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dr. Sameh Eltaybani - Publications</title>
    <meta name="description" content="Explore the full list of publications by Dr. Sameh Eltaybani. Peer-reviewed articles, research papers, and academic contributions.">
    <meta property="og:title" content="Dr. Sameh Eltaybani - Publications">
    <meta property="og:description" content="Explore the full list of publications by Dr. Sameh Eltaybani. Peer-reviewed articles, research papers, and academic contributions.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="publications.html">

    <link rel="icon" type="image/x-icon" href="img/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="assets/css/style.css" />
</head>
    
<body>

    <!-- ===== PUBLICATIONS HEADER (Full Width Gradient) ===== -->
    
    <div class="page-header-wrapper">
        <div class="container">
            <h1 class="page-header-title">List of Publications</h1>
        </div>
    </div>

    <!-- ===== MAIN CONTENT (Restricted to 1200px) ===== -->
    <div class="container">

        <!-- ===== PUBLICATIONS LIST ===== -->
        <div id="publications-list" class="publication-list">
            <p style="color: var(--dark-color); opacity: 0.6;">Loading publications...</p>
        </div>

        <!-- ===== CLOSING CTA ===== -->
        <div class="closing-cta">
            <p class="cta-question">Cannot find what you are looking for or have a question?</p>
            <p class="cta-action">
                Use the central search option on the top right corner
                <i class="fa-solid fa-magnifying-glass"></i>
                or feel free to
                <a href="contact.html" class="cta-link">
                    contact me <i class="fa-regular fa-envelope"></i>
                </a>
            </p>
        </div>

    </div><!-- end .container -->

    <!-- ===== JAVASCRIPT LOAD ORDER ===== -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/back-to-top.js"></script>

    <!-- ===== PUBLICATIONS RENDERER ===== -->

            <script>
        (function() {
            'use strict';

            let allPublications = [];
            let loadedCount = 0;
            const pageSize = 10;

            function truncateSummary(text, maxLength) {
                if (!text) return '';
                if (text.length <= maxLength) return text;
                return text.substring(0, maxLength).trim() + '...';
            }

            function createCardHTML(pub) {
                let html = '';

                if (pub.title) {
                    html += '<div class="publication-title">' + window.escapeHTML(pub.title) + '</div>';
                }

                let journalYear = '';
                if (pub.journal) {
                    journalYear += window.escapeHTML(pub.journal);
                }
                if (pub.year) {
                    if (journalYear) journalYear += ' ';
                    journalYear += '(' + window.escapeHTML(pub.year) + ')';
                }
                if (journalYear) {
                    html += '<div class="publication-journal">' + journalYear + '</div>';
                }

                if (pub.authorship) {
                    let tagClass = 'authorship-tag';
                    if (pub.authorship.toLowerCase().includes('first') || pub.authorship.toLowerCase().includes('corresponding')) {
                        tagClass += ' authorship-first';
                    } else if (pub.authorship.toLowerCase().includes('co-author')) {
                        tagClass += ' authorship-co';
                    } else {
                        tagClass += ' authorship-other';
                    }
                    html += '<span class="' + tagClass + '">' + window.escapeHTML(pub.authorship) + '</span>';
                }

                let linksHtml = '<div class="publication-links">';
                let hasLink = false;

                if (pub.pubmedLink) {
                    linksHtml += '<a href="' + window.escapeHTML(pub.pubmedLink) + '" target="_blank" rel="noopener noreferrer" class="publication-link pubmed-link"><i class="fa-solid fa-book"></i> PubMed</a>';
                    hasLink = true;
                }
                if (pub.journalLink) {
                    linksHtml += '<a href="' + window.escapeHTML(pub.journalLink) + '" target="_blank" rel="noopener noreferrer" class="publication-link journal-link"><i class="fa-solid fa-file-lines"></i> Journal</a>';
                    hasLink = true;
                }
                if (pub.blogLink) {
                    linksHtml += '<a href="' + window.escapeHTML(pub.blogLink) + '" class="publication-link blog-link"><i class="fa-solid fa-pen-to-square"></i> Blog</a>';
                    hasLink = true;
                }
                linksHtml += '</div>';

                if (hasLink) {
                    html += linksHtml;
                }

                if (pub.summary) {
                    const truncated = truncateSummary(pub.summary, 200);
                    html += '<div class="publication-summary">' + window.escapeHTML(truncated) + '</div>';
                }

                return html;
            }

            function createSeparator(abovePage, belowPage) {
                const sep = document.createElement('div');
                sep.className = 'publication-separator';
                sep.innerHTML = `
                    <span class="separator-label separator-above">Page ${abovePage} ▲</span>
                    <span class="separator-line"></span>
                    <span class="separator-label separator-below">Page ${belowPage} ▼</span>
                `;
                return sep;
            }

            function renderPublications() {
                const container = document.getElementById('publications-list');
                container.innerHTML = '';

                if (!allPublications || allPublications.length === 0) {
                    container.innerHTML = '<p style="color: var(--dark-color); opacity: 0.6;">No publications found.</p>';
                    return;
                }

                if (loadedCount === 0) {
                    loadedCount = Math.min(pageSize, allPublications.length);
                }

                // --- Render publications ---
                for (let i = 0; i < loadedCount; i++) {
                    // Add separator before a new page block (except before the very first item)
                    if (i > 0 && i % pageSize === 0) {
                        const pageNum = Math.floor(i / pageSize) + 1;
                        const abovePage = pageNum - 1;
                        const belowPage = pageNum;
                        const sep = createSeparator(abovePage, belowPage);
                        container.appendChild(sep);
                    }

                    const card = document.createElement('div');
                    card.className = 'publication-card';
                    card.innerHTML = createCardHTML(allPublications[i]);
                    container.appendChild(card);
                }

                // --- Add bottom separator + "See More" if more items exist ---
                if (loadedCount < allPublications.length) {
                    const currentPage = Math.floor(loadedCount / pageSize) + 1;
                    const nextPage = currentPage + 1;

                    const sep = createSeparator(currentPage, nextPage);
                    container.appendChild(sep);

                    const wrapper = document.createElement('div');
                    wrapper.style.cssText = 'text-align: center; margin: var(--space-md) 0;';
                    
                    const seeMoreBtn = document.createElement('button');
                    seeMoreBtn.className = 'see-more-btn';
                    seeMoreBtn.innerHTML = 'See more <i class="fa-solid fa-arrow-down"></i>';
                    seeMoreBtn.addEventListener('click', function() {
                        loadedCount = Math.min(loadedCount + pageSize, allPublications.length);
                        renderPublications();
                    });
                    
                    wrapper.appendChild(seeMoreBtn);
                    container.appendChild(wrapper);
                }
            }

            async function loadPublications() {
                const container = document.getElementById('publications-list');

                try {
                    const response = await fetch('json/publications.json');
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    allPublications = await response.json();

                    if (!allPublications || allPublications.length === 0) {
                        container.innerHTML = '<p style="color: var(--dark-color); opacity: 0.6;">No publications found.</p>';
                        return;
                    }

                    loadedCount = Math.min(pageSize, allPublications.length);
                    renderPublications();

                } catch (error) {
                    container.innerHTML = '<p style="color: var(--dark-color); opacity: 0.6;">Unable to load publications at this time. Please try again later.</p>';
                    console.error('Error loading publications:', error);
                }
            }

            document.addEventListener('DOMContentLoaded', loadPublications);
        })();
    </script>

</body>
</html>
