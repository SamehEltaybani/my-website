<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dr. Sameh Eltaybani - Search Results</title>
    <meta name="description" content="Search results for Dr. Sameh Eltaybani's website. Find publications, blog posts, and pages.">
    <meta property="og:title" content="Dr. Sameh Eltaybani - Search Results">
    <meta property="og:description" content="Search results for Dr. Sameh Eltaybani's website.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="search.html">

    <link rel="icon" type="image/x-icon" href="/my-website/img/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="/my-website/assets/css/style.css" />
</head>
    
<body>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="container">

        <!-- ===== SEARCH RESULTS HEADER ===== -->
        <div class="search-results-header">
            <h1 class="search-results-title">Search Results</h1>
            <p class="search-results-count" id="results-count">Loading...</p>
        </div>

        <!-- ===== FILTER BUTTONS ===== -->
        <div class="search-filters" id="search-filters">
            <button class="search-filter-btn active" data-filter="all">All</button>
            <button class="search-filter-btn" data-filter="publication">Publications</button>
            <button class="search-filter-btn" data-filter="blog">Blog</button>
            <button class="search-filter-btn" data-filter="page">Pages</button>
        </div>

        <!-- ===== RESULTS LIST ===== -->
        <div id="search-results-list" class="search-results-list">
            <p style="color: var(--dark-color); opacity: 0.6;">Loading results...</p>
        </div>

        <!-- ===== RECENT SEARCHES ===== -->
        <div class="search-recent" id="search-recent">
            <p class="search-recent-title">Recent Searches</p>
            <div class="search-recent-list" id="recent-list"></div>
        </div>

        <!-- ===== CLOSING CTA ===== -->
        <div class="closing-cta">
            <p class="cta-question">Cannot find what you are looking for?</p>
            <p class="cta-action">
                Try different keywords or feel free to
                <a href="/my-website/contact.html" class="cta-link">
                    contact me <i class="fa-regular fa-envelope"></i>
                </a>
            </p>
        </div>

    </div><!-- end .container -->

    <!-- ===== JAVASCRIPT ===== -->
    <script src="/my-website/assets/js/utils.js"></script>
    <script src="/my-website/assets/js/navbar.js"></script>
    <script src="/my-website/assets/js/footer.js"></script>
    <script src="/my-website/assets/js/back-to-top.js"></script>
    <script src="/my-website/assets/js/search.js"></script>

    <!-- ===== SEARCH RESULTS RENDERER ===== -->
    <script>
        (function() {
            'use strict';

            let allItems = [];
            let currentFilter = 'all';
            let currentQuery = '';

            // ============================================
            // GET URL PARAMETER
            // ============================================
            function getQueryParam(param) {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(param);
            }

            // ============================================
            // LOAD ALL DATA
            // ============================================
            async function loadData() {
                try {
                    const files = [
                        { url: '/my-website/json/publications.json', source: 'publication', label: 'Publication' },
                        { url: '/my-website/json/blog.json', source: 'blog', label: 'Blog' },
                        { url: '/my-website/json/pages.json', source: 'page', label: 'Page' }
                    ];

                    let allResults = [];

                    for (const file of files) {
                        try {
                            const response = await fetch(file.url);
                            if (!response.ok) continue;
                            const data = await response.json();
                            
                            data.forEach(function(item) {
                                const searchableText = [
                                    item.title || '',
                                    item.shortTitle || '',
                                    item.authorship || '',
                                    item.journal || '',
                                    item.year || '',
                                    item.summary || '',
                                    item.categories ? item.categories.join(' ') : '',
                                    item.keywords ? item.keywords.join(' ') : ''
                                ].join(' ').toLowerCase();

                                let link = '#';
                                let id = item.id || '';

                                if (file.source === 'publication') {
                                    link = '/my-website/publications.html?id=' + encodeURIComponent(id);
                                } else if (file.source === 'blog') {
                                    link = '/my-website/blog.html?id=' + encodeURIComponent(id);
                                } else if (file.source === 'page') {
                                    link = item.url || '#';
                                }

                                allResults.push({
                                    id: id,
                                    title: item.title || 'Untitled',
                                    source: file.source,
                                    sourceLabel: file.label,
                                    link: link,
                                    searchableText: searchableText,
                                    raw: item
                                });
                            });
                        } catch (e) {
                            console.warn('Could not load', file.url, e);
                        }
                    }

                    allItems = allResults;
                    return allItems;
                } catch (error) {
                    console.error('Error loading search data:', error);
                    return [];
                }
            }

            // ============================================
            // SEARCH FUNCTION
            // ============================================
            
            function searchItems(query, filter) {
                if (!query || query.trim().length === 0) {
                    return [];
                }
            
                const lowerQuery = query.toLowerCase().trim();
                const words = lowerQuery.split(/\s+/).filter(function(w) { return w.length > 0; });
                const isPhrase = words.length > 2;
            
                let results = allItems;
            
                // Apply filter
                if (filter !== 'all') {
                    results = results.filter(function(item) {
                        return item.source === filter;
                    });
                }
            
                // Score and match
                const scored = results.map(function(item) {
                    let score = 0;
                    const text = item.searchableText;
                    const titleLower = (item.title || '').toLowerCase();
            
                    // --- EXACT PHRASE MATCH ---
                    if (text.includes(lowerQuery)) {
                        score += 100;
                    }
                    if (titleLower.includes(lowerQuery)) {
                        score += 80;
                    }
            
                    // --- INDIVIDUAL WORD MATCHES ---
                    const wordWeight = isPhrase ? 2 : 10;
            
                    words.forEach(function(word) {
                        if (word.length >= 2 && text.includes(word)) {
                            score += wordWeight;
                        }
                        if (word.length >= 2 && titleLower.includes(word)) {
                            score += wordWeight * 1.5;
                        }
                    });
            
                    // --- TITLE BOOST ---
                    if (titleLower.startsWith(lowerQuery)) {
                        score += 50;
                    }
            
                    return { item: item, score: score };
                });
            
                const filtered = scored
                    .filter(function(s) { return s.score > 0; })
                    .sort(function(a, b) { return b.score - a.score; })
                    .map(function(s) { return s.item; });
            
                return filtered;
            }

            // ============================================
            // HIGHLIGHT TEXT
            // ============================================
            function highlightText(text, query) {
                if (!text || !query) return text;
                const lowerText = text.toLowerCase();
                const lowerQuery = query.toLowerCase().trim();
                const index = lowerText.indexOf(lowerQuery);
                if (index === -1) return text;
                const before = text.substring(0, index);
                const match = text.substring(index, index + query.length);
                const after = text.substring(index + query.length);
                return before + '<span style="background: rgba(0, 173, 181, 0.15); font-weight: 600; padding: 0 2px; border-radius: 2px;">' + match + '</span>' + after;
            }

            // ============================================
            // RENDER RESULTS
            // ============================================
            function renderResults(results, query) {
                const container = document.getElementById('search-results-list');
                const countEl = document.getElementById('results-count');

                // Update count
                if (results.length === 0) {
                    countEl.innerHTML = 'No results found for "<strong>' + window.escapeHTML(query) + '</strong>".';
                } else {
                    countEl.innerHTML = results.length + ' result' + (results.length > 1 ? 's' : '') + ' for "<strong>' + window.escapeHTML(query) + '</strong>"';
                }

                container.innerHTML = '';

                if (results.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: var(--space-xl) 0;">
                            <p style="font-size: 1.2rem; color: var(--dark-color); opacity: 0.6; margin-bottom: var(--space-sm);">
                                <i class="fa-regular fa-face-sad-tear" style="font-size: 2rem; display: block; margin-bottom: var(--space-md); color: var(--accent-color);"></i>
                                No results found for "<strong>${window.escapeHTML(query)}</strong>".
                            </p>
                            <p style="color: var(--dark-color); opacity: 0.4; font-size: 0.95rem;">
                                Try different keywords, check your spelling, or browse the site navigation above.
                            </p>
                        </div>
                    `;
                    return;
                }

                results.forEach(function(item) {
                    const card = document.createElement('a');
                    card.className = 'search-result-card';
                    card.href = item.link;

                    const row = document.createElement('div');
                    row.className = 'result-row';

                    const title = document.createElement('span');
                    title.className = 'result-title';
                    title.innerHTML = highlightText(item.title, query);

                    const source = document.createElement('span');
                    source.className = 'result-source source-' + item.source;
                    source.textContent = item.sourceLabel;

                    row.appendChild(title);
                    row.appendChild(source);
                    card.appendChild(row);
                    container.appendChild(card);
                });
            }

            // ============================================
            // RECENT SEARCHES
            // ============================================
            function getRecentSearches() {
                try {
                    const stored = localStorage.getItem('recentSearches');
                    if (stored) {
                        return JSON.parse(stored);
                    }
                } catch (e) {
                    // ignore
                }
                return [];
            }

            function saveRecentSearch(query) {
                if (!query || query.trim().length === 0) return;
                let recent = getRecentSearches();
                // Remove duplicate
                recent = recent.filter(function(item) {
                    return item.toLowerCase() !== query.toLowerCase().trim();
                });
                // Add to front
                recent.unshift(query.trim());
                // Keep only last 10
                recent = recent.slice(0, 10);
                try {
                    localStorage.setItem('recentSearches', JSON.stringify(recent));
                } catch (e) {
                    // ignore
                }
                renderRecentSearches();
            }

            function clearRecentSearches() {
                try {
                    localStorage.removeItem('recentSearches');
                } catch (e) {
                    // ignore
                }
                renderRecentSearches();
            }

            function renderRecentSearches() {
                const container = document.getElementById('recent-list');
                const recent = getRecentSearches();

                if (recent.length === 0) {
                    container.innerHTML = '<span style="font-size: 0.85rem; color: var(--dark-color); opacity: 0.3;">No recent searches</span>';
                    return;
                }

                container.innerHTML = '';
                recent.forEach(function(query) {
                    const a = document.createElement('a');
                    a.className = 'search-recent-item';
                    a.href = '/my-website/search.html?q=' + encodeURIComponent(query);
                    a.textContent = query;

                    const clearBtn = document.createElement('button');
                    clearBtn.className = 'clear-recent';
                    clearBtn.setAttribute('aria-label', 'Remove from recent searches');
                    clearBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                    clearBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        let recent = getRecentSearches();
                        recent = recent.filter(function(item) {
                            return item.toLowerCase() !== query.toLowerCase();
                        });
                        try {
                            localStorage.setItem('recentSearches', JSON.stringify(recent));
                        } catch (e) {
                            // ignore
                        }
                        renderRecentSearches();
                    });

                    a.appendChild(clearBtn);
                    container.appendChild(a);
                });

                // Add clear all button
                const clearAll = document.createElement('button');
                clearAll.className = 'search-recent-item';
                clearAll.style.cssText = 'background: transparent; opacity: 0.4; font-size: 0.75rem; cursor: pointer; border: none; font-family: inherit;';
                clearAll.textContent = 'Clear all';
                clearAll.addEventListener('click', function() {
                    clearRecentSearches();
                });
                container.appendChild(clearAll);
            }

            // ============================================
            // FILTER BUTTONS
            // ============================================
            function setupFilters() {
                const buttons = document.querySelectorAll('.search-filter-btn');
                buttons.forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        buttons.forEach(function(b) { b.classList.remove('active'); });
                        btn.classList.add('active');
                        currentFilter = btn.dataset.filter;
                        const results = searchItems(currentQuery, currentFilter);
                        renderResults(results, currentQuery);
                    });
                });
            }

            // ============================================
            // INITIALIZE
            // ============================================
            async function init() {
                // Setup filter buttons
                setupFilters();

                // Get query from URL
                const query = getQueryParam('q');
                if (!query) {
                    document.getElementById('results-count').textContent = 'No search query provided.';
                    document.getElementById('search-results-list').innerHTML = `
                        <div style="text-align: center; padding: var(--space-xl) 0;">
                            <p style="color: var(--dark-color); opacity: 0.5;">Please use the search box to search the site.</p>
                        </div>
                    `;
                    renderRecentSearches();
                    return;
                }

                currentQuery = query;

                // Load data
                await loadData();

                // Perform search
                const results = searchItems(query, 'all');
                renderResults(results, query);

                // Save to recent searches
                saveRecentSearch(query);

                // Render recent searches
                renderRecentSearches();

                // Update filter buttons to show correct count
                // (optional enhancement)
            }

            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>

</body>
</html>
